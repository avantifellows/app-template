# Standard for every AF internal app. Do not edit: the go-live check compares it with the template's.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22 || nvm install 22
        - npm ci --cache .npm --prefer-offline
    build:
      commands:
        # Amplify gives console env vars to the build only; this writes them for the server to read at runtime.
        - node scripts/write-env.mjs
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
